<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/diy/fonts/font.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>JxShap网页版</title>
    <script>
        (function () {
            var ua = navigator.userAgent;
            // 仅 Chromium Edge 用 overlay 键盘；EdgiOS 为 WebKit，保持 resizes-content
            if (/Edg\//.test(ua) && !/EdgiOS/i.test(ua)) {
                var meta = document.querySelector('meta[name="viewport"]');
                if (meta) {
                    meta.setAttribute(
                        'content',
                        'width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual'
                    );
                }
            }
        })();
    </script>
    <style>
        html,
        body {
            margin: 0;
            min-height: 100%;
            background-color: #f7f7fa;
        }

        @media (prefers-color-scheme: dark) {
            html {
                color-scheme: dark;
                background-color: #060608;
            }

            body {
                background-color: #060608;
            }
        }
    </style>
    <script>
        var _hmt = _hmt || [];
        (function () {
            const url = window.location.hostname;
            if (url.includes('127.0.0.1')) {
                return;
            }
            var hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?ef032346e8fc95d56c7386b807e76e64";
            var s = document.getElementsByTagName("script")[0];
            s.parentNode.insertBefore(hm, s);
        })();
    </script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/boot.ts"></script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
